- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue"]
    env_action: create
    domain_name: devopslab.shop
    ami_id: ami-0d97d7f07b25dd693
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      key_name: my-key-pair
      security_group: sg-00848d434a4dfb091
      region: us-east-1
    loop: "{{ instances }}"
    when: env_action == "create"
