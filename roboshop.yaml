- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    env_action: create
    domain_name: devopslab.shop
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_group: sg-00848d434a4dfb091
      region: us-east-1
    loop: "{{ instances }}"
    when: env_action == "create"
    register: ec2_output

  - name: print ec2 creation output
    debug:
      msg: "{{ ec2_output }}"